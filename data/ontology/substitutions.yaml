# Curated substitutions used to adapt a recipe to a diet or exclusion.
# Each source ingredient lists candidate swaps in preference order. A candidate is only used if the
# adapted recipe re-validates cleanly against every active constraint.
#   to   - ontology ingredient ids that replace the source (several = combined swap)
#   how  - cooking guidance shown to the user
# Swaps follow common Indian home-cooking practice (e.g. Jain / no-onion-garlic kitchens).

onion:
  - {to: [cabbage], how: "Use finely chopped cabbage, sautéed until soft, for the body and sweetness onion gives."}
  - {to: [tomato], how: "Use an extra tomato, cooked down well, for body."}
shallot:
  - {to: [cabbage], how: "Use finely chopped cabbage in place of the small onions."}
spring_onion:
  - {to: [coriander_leaves], how: "Garnish with coriander leaves instead of spring onion greens."}
leek:
  - {to: [cabbage], how: "Use thinly sliced cabbage instead of leek."}
onion_powder:
  - {to: [asafoetida], how: "Use a pinch of hing instead of onion powder."}
garlic:
  - {to: [asafoetida], how: "Add a pinch of hing to the hot oil for the savoury depth garlic gives."}
garlic_powder:
  - {to: [asafoetida], how: "Use a pinch of hing instead of garlic powder."}
ginger:
  - {to: [dry_ginger], how: "Use 1/2 tsp dry ginger powder (sonth) per inch of fresh ginger."}
  - {to: [green_chilli], how: "Skip the ginger and add a little extra green chilli for warmth."}
ginger_garlic_paste:
  - {to: [asafoetida, dry_ginger], how: "Use a pinch of hing plus 1/2 tsp dry ginger powder per tablespoon of paste."}
  - {to: [asafoetida, green_chilli], how: "Use a pinch of hing and an extra green chilli per tablespoon of paste."}
potato:
  - {to: [raw_banana], how: "Use raw banana (kacha kela), peeled and cubed; it holds its shape like potato."}
  - {to: [pumpkin], how: "Use cubed pumpkin; reduce cooking time slightly."}
sweet_potato:
  - {to: [pumpkin], how: "Use cubed red pumpkin."}
carrot:
  - {to: [pumpkin], how: "Use red pumpkin for the same colour and sweetness."}
  - {to: [capsicum], how: "Use red bell pepper for colour and crunch."}
radish:
  - {to: [cucumber], how: "Use cucumber for crunch."}
beetroot:
  - {to: [pumpkin], how: "Use red pumpkin."}
yam:
  - {to: [raw_banana], how: "Use raw banana."}
colocasia_root:
  - {to: [raw_banana], how: "Use raw banana."}
mushroom:
  - {to: [paneer], how: "Use cubed paneer."}
  - {to: [capsicum], how: "Use capsicum strips."}
mixed_vegetables:
  - {to: [peas, beans, capsicum, cauliflower], how: "Use peas, beans, capsicum and cauliflower (no root vegetables)."}
spice_blend:
  - {to: [garam_masala, amchur], how: "Use garam masala with a pinch of amchur instead of the packaged blend."}
maggi_masala:
  - {to: [garam_masala, amchur, turmeric_powder], how: "Season with garam masala, amchur and a pinch of turmeric instead of the tastemaker."}
ketchup:
  - {to: [tomato, sugar], how: "Use tomato puree with a pinch of sugar instead of ketchup."}
chilli_sauce:
  - {to: [red_chilli, vinegar], how: "Use red chilli paste with a dash of vinegar."}
pasta_sauce:
  - {to: [tomato, herbs], how: "Use tomato puree cooked with dried herbs."}
stock:
  - {to: [water], how: "Use water with a little extra salt and spice."}
chicken_stock:
  - {to: [water], how: "Use water with a little extra salt and spice."}
chutney_green:
