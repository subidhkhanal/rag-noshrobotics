# Canonical ingredient ontology.
# Each entry: id: {aliases, tags, may, family, contains, note}
#   tags     - properties the ingredient definitely has (drive BLOCK verdicts)
#   may      - properties it may have depending on brand/recipe (drive FLAG verdicts)
#   family   - parent ingredient for user exclusions ("no onion" also catches shallots)
#   contains - components of compound items; their tags/families are inherited
# Aliases are matched on whole tokens, longest phrase first, after light plural stemming.

