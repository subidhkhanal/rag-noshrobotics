# Dialogue-understanding test set: does each message get the right KIND of answer about the right dish?
# Each case runs its `setup` messages, then every `say` turn independently from that same state.
# expect:
#   mode: search | detail | chat | plan
#   item: card label from the setup's screen ("1".."5", "Mon".."Sun"), or "all" (answer about every card)
#   name: a word that must be in the chosen card's name (for references by dish name)
#   want: steps | ingredients (detail answers only)
#   recall: true (the answer must list earlier suggestions)
# Slices (tag): plan_day, ordinal, pronoun, by_name, question, multi, recall, new_request, social, hinglish, hindi,
# no_context. Written by hand, independently of the implementation. Don't edit cases to fit the system.

- setup: ["plan my week, Jain dinners"]
  turns:
    - {say: "explain monday", tag: plan_day, expect: {mode: detail, item: Mon}}
    - {say: "explain friday item", tag: plan_day, expect: {mode: detail, item: Fri}}
    - {say: "explain mon", tag: plan_day, expect: {mode: detail, item: Mon}}
    - {say: "how do I make wednesday's dinner", tag: plan_day, expect: {mode: detail, item: Wed, want: steps}}
    - {say: "ingredients for thursday", tag: plan_day, expect: {mode: detail, item: Thu, want: ingredients}}
    - {say: "what do I need for the saturday one", tag: plan_day, expect: {mode: detail, item: Sat, want: ingredients}}
    - {say: "tell me more about thursday", tag: plan_day, expect: {mode: detail, item: Thu}}
    - {say: "what is friday's dish", tag: plan_day, expect: {mode: detail, item: Fri}}
    - {say: "friday", tag: plan_day, expect: {mode: detail, item: Fri}}
    - {say: "what's on tuesday", tag: plan_day, expect: {mode: detail, item: Tue}}
    - {say: "show me sunday", tag: plan_day, expect: {mode: detail, item: Sun}}
    - {say: "details of the last day", tag: plan_day, expect: {mode: detail, item: Sun}}
    - {say: "2nd day recipe", tag: plan_day, expect: {mode: detail, item: Tue}}
    - {say: "day 3", tag: plan_day, expect: {mode: detail, item: Wed}}
    - {say: "is monday's dish healthy", tag: question, expect: {mode: detail, item: Mon}}
    - {say: "is the friday one spicy?", tag: question, expect: {mode: detail, item: Fri}}
    - {say: "does tuesday's have garlic?", tag: question, expect: {mode: detail, item: Tue}}
    - {say: "how long does wednesday take", tag: question, expect: {mode: detail, item: Wed}}
    - {say: "how many people does the sunday dinner serve", tag: question, expect: {mode: detail, item: Sun}}
    - {say: "which day is the quickest", tag: multi, expect: {mode: detail, item: all}}
    - {say: "which of these are spicy", tag: multi, expect: {mode: detail, item: all}}
    - {say: "what was the plan again", tag: recall, expect: {mode: search, recall: true}}
    - {say: "remind me of the dishes you suggested", tag: recall, expect: {mode: search, recall: true}}
    - {say: "plan next week too, but lunches", tag: new_request, expect: {mode: plan}}
    - {say: "sunday wala kaise banaye", tag: hinglish, expect: {mode: detail, item: Sun, want: steps}}
    - {say: "kya monday wala jain hai", tag: hinglish, expect: {mode: detail, item: Mon}}
    - {say: "budhvar ki recipe batao", tag: hinglish, expect: {mode: detail, item: Wed}}
    - {say: "सोमवार की रेसिपी बताओ", tag: hindi, expect: {mode: detail, item: Mon}}
    - {say: "शुक्रवार वाली डिश में क्या क्या चाहिए", tag: hindi, expect: {mode: detail, item: Fri, want: ingredients}}

