# Retrieval golden set: one concept, asked three ways (English, Hinglish, Devanagari).
# Relevance is defined by facts about each recipe, never by what the system returns:
#   name: regex that the recipe's name must match (case-insensitive)
#   ings: ingredient ids that must all appear in the recipe (with ontology inheritance)
# A recipe is relevant when every given predicate holds. Queries are written the way people type them;
# the English line is often a description rather than the dish name, so meaning-based search is tested too.
# Written by hand, independently of the search code. Do not tune this file to the system's output.

